name: CD

# Builds and publishes container images on every push to main, after CI has
# already passed for that commit (CI runs on the same push via ci.yml).
#
# Deploy step: this repo is deployed on DigitalOcean App Platform. DO App
# Platform's native GitHub integration (Settings → App → the "Auto Deploy"
# toggle on the connected repo) is the simplest path and needs nothing here
# — merging to main is enough. The optional `deploy` job below is only for
# teams who want deploys explicitly gated by this workflow (e.g. to also
# require the CI job above to succeed, or to control the deploy from here
# instead of DO's dashboard). It only runs when both
# DIGITALOCEAN_ACCESS_TOKEN and DO_APP_ID are set as repo secrets — see
# docs/DEPLOYMENT.md.

on:
  push:
    branches: [main, master]
  workflow_dispatch: {}

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

jobs:
  publish-images:
    name: Build & push images to GHCR
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      api-image: ${{ steps.meta-api.outputs.tags }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract API image metadata
        id: meta-api
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}-api
          tags: |
            type=sha,format=long
            type=raw,value=latest

      - name: Build & push API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ steps.meta-api.outputs.tags }}

      - name: Extract widget image metadata
        id: meta-widget
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}-widget
          tags: |
            type=sha,format=long
            type=raw,value=latest

      - name: Build & push widget image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: frontend/Dockerfile
          push: true
          tags: ${{ steps.meta-widget.outputs.tags }}
          # Falls back to the Dockerfile's own default when the repo variable
          # isn't set, instead of overriding it with an empty string.
          build-args: |
            VITE_API_URL=${{ vars.VITE_API_URL || 'http://localhost:8000' }}

  deploy:
    name: Trigger DigitalOcean App Platform deployment
    runs-on: ubuntu-latest
    needs: publish-images
    if: ${{ vars.ENABLE_DOCTL_DEPLOY == 'true' }}
    steps:
      - name: Install doctl
        uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}

      - name: Trigger deployment
        run: doctl apps create-deployment "${{ secrets.DO_APP_ID }}" --wait
